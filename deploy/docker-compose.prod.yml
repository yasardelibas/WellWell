name: medguard

services:
  postgres:
    image: postgres:16-alpine
    container_name: medguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: medguard-api:latest
    container_name: medguard-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Database__AutoMigrate: "true"
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Jwt__Issuer: medguard
      Jwt__Audience: medguard-app
      Security__FieldEncryptionKey: ${FIELD_ENCRYPTION_KEY}
      # Caddy terminates TLS, so the app must not redirect the already-secure proxied traffic.
      Security__EnforceHttps: "false"
      Demo__Enabled: "true"
      Email__ApiKey: ${RESEND_API_KEY}
      Email__FromAddress: ${EMAIL_FROM}
      EmergencyCard__PublicBaseUrl: ${PUBLIC_BASE_URL}
      Ai__ApiKey: ${OPENAI_API_KEY}
      Ai__VisionEnabled: ${AI_VISION_ENABLED:-true}
      Ai__ExplanationsEnabled: ${AI_EXPLANATIONS_ENABLED:-true}
      Ai__TimeoutSeconds: "40"
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    container_name: medguard-caddy
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
